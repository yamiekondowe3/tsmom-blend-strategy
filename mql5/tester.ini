; Strategy Tester configuration for the Book B parity test.
;
; SIMULATION ONLY. This runs the EA inside MT5's Strategy Tester against
; historical data. It places no order on the account. The project brief bars
; live or demo execution until build step 8, and the EA itself refuses to trade
; outside the tester unless AllowLiveTrading is explicitly set true.
;
; Model=2 is "open prices only": the EA acts once per completed H4 bar, which is
; exactly what the Python backtest does, so a finer tick model would only add
; intrabar noise the strategy never looks at.

[Tester]
Expert=TSMOM_Blend_EA
Symbol=XAUUSD
Period=H4
Model=2
Optimization=0
ForwardMode=0
FromDate=2016.01.01
ToDate=2026.09.01
Deposit=100000
Currency=USD
Leverage=1:100
ExecutionMode=0
Visual=0
ShutdownTerminal=1
Report=tsmom_parity_report
ReplaceReport=1

[TesterInputs]
Sleeve1Symbol=XAUUSD
Sleeve1SlowBars=308
Sleeve1FastBars=51
Sleeve1VolWindow=103
Sleeve1RegimeLB=2586
Sleeve1PeriodsYear=1584.1
Sleeve2Symbol=BTCUSD
Sleeve2SlowBars=251
Sleeve2FastBars=42
Sleeve2VolWindow=84
Sleeve2RegimeLB=2108
Sleeve2PeriodsYear=1508.3
VolTarget=0.10
MaxLeverage=3.0
RegimeDecile=0.9
KillPercentile=0.95
UseKillSwitch=true
UseDirectionalFilt=true
SleeveAllocation=0.5
MinLotChange=0.0
DumpParity=true
ParityFile=tsmom_parity_ea.csv
AllowLiveTrading=false
MagicNumber=20260922
