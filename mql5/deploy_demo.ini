; Startup configuration for DEMO deployment (build step 8).
;
; Opens XAUUSD H4 and attaches TSMOM_Blend_EA with the demo preset. The EA is
; multi-symbol: one instance on one chart trades BOTH sleeves, so the portfolio
; kill switch and the netting decision live in a single place rather than being
; split across two chart instances that cannot see each other.
;
; No login credentials are set here -- the terminal is already authorised on
; Deriv-Demo 6289430 and this file deliberately does not touch that.

[StartUp]
Expert=TSMOM_Blend_EA
ExpertParameters=TSMOM_demo.set
Symbol=XAUUSD
Period=H4
